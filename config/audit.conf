# Configuration du Daily Security Snapshot
# Propriétaire : Vincent Mactar Senghor

# Fichier lu par l'agent Wazuh
AUDIT_OUTPUT="/var/log/daily-security-snapshot/audit.jsonl"

# Répertoires exclus des parcours find (performance)
# /var/ossec est exclu car c'est l'outillage SIEM lui-même (agent/manager
# Wazuh installé sur la même machine que l'audit) : ses fichiers packagés
# (ex. sa propre distribution Python) ne font pas partie du système audité.
AUDIT_EXCLUDE_PATHS="/proc /sys /dev /run /snap /var/lib/docker /var/ossec"

# Ne pas franchir les points de montage (find -xdev)
AUDIT_STAY_ON_FS=1
