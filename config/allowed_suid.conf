# Binaires autorisés à posséder le bit SUID ou SGID sur ce serveur.
# Propriétaire : Diembi Daniel Emmanuel
#
# Un chemin ABSOLU par ligne, tel que renvoyé par `find ... -perm -4000 -o -perm -2000`.
# Tout binaire SUID/SGID trouvé hors de cette liste = FAIL (severity high).
#
# Cette liste correspond aux binaires SUID/SGID standards d'une installation
# Ubuntu/Debian "propre". Elle doit être adaptée au serveur réel avant la
# soutenance (lancer `find / -perm -4000 -o -perm -2000 -type f 2>/dev/null`
# sur la VM de démo et comparer).

# Changement de mot de passe / d'identité
/usr/bin/passwd
/usr/bin/chsh
/usr/bin/chfn
/usr/bin/chage
/usr/bin/gpasswd
/usr/bin/newgrp
/usr/bin/su
/usr/bin/sudo
/usr/bin/pkexec

# Montage / réseau bas niveau
/usr/bin/mount
/usr/bin/umount
/usr/bin/fusermount
/usr/bin/fusermount3
/usr/bin/ping
/usr/bin/traceroute6.iputils

# Ecran / terminaux
/usr/bin/wall
/usr/bin/write
/usr/bin/chage

# SSH
/usr/lib/openssh/ssh-keysign

# Crontab utilisateur
/usr/bin/crontab

# Impression (CUPS), si installé
/usr/lib/cups/backend/cups-lpd

# Spécifique à la VM de démo (Kali Linux) — capturé le 2026-09-10 avec :
